backend:
  name: github
  repo: rahulmourya336/portfolio-site-v2
  branch: main

local_backend: true

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    create: true
    delete: true
    slug: "{{order}}-{{slug}}"
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Used in URLs and as the card key" }
      - { label: Description, name: description, widget: text }
      - { label: Live URL, name: demoLink, widget: string }
      - { label: GitHub Link, name: githubLink, widget: string, required: false }
      - { label: Thumbnail, name: thumbnail, widget: image }
      - label: Tags
        name: tags
        widget: list
        field: { label: Tag, name: tag, widget: string }
      - label: Schema type
        name: kind
        widget: select
        options: ["SoftwareApplication", "CreativeWork"]
        default: "SoftwareApplication"
        hint: "SoftwareApplication for apps people use, CreativeWork for everything else"
      - { label: Featured on home page, name: featured, widget: boolean, default: false }
      - { label: Sort Order, name: order, widget: number, value_type: int, default: 99 }

  - name: blog
    label: Blog posts
    label_singular: Post
    folder: content/blog
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Must match the file name" }
      - { label: Description, name: description, widget: text, hint: "Also used as the meta description, so keep it under 160 characters" }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: Last updated, name: updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
      - label: Topic
        name: topic
        widget: select
        options: ["CSS", "HTML", "JavaScript", "React", "AWS", "General"]
        default: "CSS"
      - label: Tags
        name: tags
        widget: list
        field: { label: Tag, name: tag, widget: string }
      - { label: Draft, name: draft, widget: boolean, default: false, hint: "Drafts are excluded from the site and the sitemap" }
      - { label: Body, name: body, widget: markdown }
